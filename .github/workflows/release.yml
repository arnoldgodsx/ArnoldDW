name: Release

on:
  push:
    tags:
      - "v*"
  # Manual release from the Actions tab: builds the selected branch and creates the
  # v<__version__> tag on that commit together with the GitHub Release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y

      - name: Fetch pinned runtime binaries and mirror their archives
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/fetch_binaries.py --archive-dir build/runtime-archives
          if ($LASTEXITCODE -ne 0) { throw "Fetching runtime binaries failed." }
          # Upstream FFmpeg autobuilds are pruned after a few weeks; keep the exact verified
          # archives on a prerelease so tools/fetch_binaries.py can fall back to them.
          gh release view runtime-binaries *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create runtime-binaries --prerelease --latest=false `
              --title "Runtime binaries (build mirror)" `
              --notes "SHA-256-pinned ffmpeg and Deno archives used by tools/fetch_binaries.py. Not an app release."
            if ($LASTEXITCODE -ne 0) { throw "Could not create the runtime-binaries release." }
          }
          $archives = (Get-ChildItem build/runtime-archives -File).FullName
          gh release upload runtime-binaries @archives --clobber
          if ($LASTEXITCODE -ne 0) { throw "Mirroring runtime archives failed." }

      - name: Build release artifacts
        shell: pwsh
        run: .\tools\build.ps1 -Python (Get-Command python).Source -RequireInstaller

      - name: Install, launch and uninstall with the setup wizard
        shell: pwsh
        run: |
          $version = (& python -c "from arnold_dw import __version__; print(__version__)").Trim()
          .\tools\installer_smoke.ps1 -Setup "dist/ArnoldDW-$version-setup.exe"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARNOLD_DW_RELEASE_KEY: ${{ secrets.ARNOLD_DW_RELEASE_KEY }}
        run: |
          $version = (& python -c "from arnold_dw import __version__; print(__version__)").Trim()
          if ("${{ github.event_name }}" -eq "push") {
            $tag = "${{ github.ref_name }}"
            if ($tag -ne "v$version") { throw "Release tag $tag does not match package version v$version" }
          } else {
            $tag = "v$version"
            if (git ls-remote --tags origin "refs/tags/$tag") { throw "Tag $tag already exists; bump __version__ first." }
          }
          $notes = $null
          $changelog = Join-Path $PWD "CHANGELOG.md"
          if (Test-Path -LiteralPath $changelog) {
            $content = Get-Content -Raw -Encoding UTF8 $changelog
            $escapedTag = [regex]::Escape($tag)
            $escapedVersion = [regex]::Escape($version)
            $pattern = "(?ms)^##\s+\[?(?:$escapedTag|v?$escapedVersion)\]?[^\r\n]*\r?\n(.*?)(?=^##\s|\z)"
            $match = [regex]::Match($content, $pattern)
            if ($match.Success -and $match.Groups[1].Value.Trim()) {
              $notes = Join-Path $env:RUNNER_TEMP "release-notes.md"
              Set-Content -LiteralPath $notes -Value $match.Groups[1].Value.Trim() -Encoding UTF8
            }
          }
          $setup = "dist/ArnoldDW-$version-setup.exe"
          $published = (Get-Date).ToUniversalTime().ToString("o")
          $setupUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/ArnoldDW-$version-setup.exe"
          $manifestArgs = @(
            "tools/make_manifest.py", "--setup", $setup, "--version", $version,
            "--published", $published, "--setup-url", $setupUrl, "--output", "dist/latest.json"
          )
          if ($notes) { $manifestArgs += @("--notes-file", $notes) }
          # The setup wizard is the one download users need; it is what "Latest" offers.
          $assets = @($setup)
          if ($env:ARNOLD_DW_RELEASE_KEY) {
            & python @manifestArgs
            if ($LASTEXITCODE -ne 0) { throw "Update manifest generation failed." }
            $assets += "dist/latest.json"
          } else {
            # The in-app updater is not wired to the UI yet; publish without a manifest
            # rather than fail the release when the signing secret is not configured.
            Write-Warning "ARNOLD_DW_RELEASE_KEY is not set; latest.json is not published."
          }
          if ($notes) {
            gh release create $tag @assets --target $env:GITHUB_SHA --latest --title "Arnold DW $version" --notes-file $notes
          } else {
            gh release create $tag @assets --target $env:GITHUB_SHA --latest --title "Arnold DW $version" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "Creating the GitHub Release failed." }
