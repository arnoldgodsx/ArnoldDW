name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y

      - name: Build release artifacts
        shell: pwsh
        run: .\tools\build.ps1 -Python (Get-Command python).Source

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = (& python -c "from arnold_dw import __version__; print(__version__)").Trim()
          if ($tag -ne "v$version") { throw "Release tag $tag does not match package version v$version" }
          $notes = $null
          $changelog = Join-Path $PWD "CHANGELOG.md"
          if (Test-Path -LiteralPath $changelog) {
            $content = Get-Content -Raw -Encoding UTF8 $changelog
            $escapedTag = [regex]::Escape($tag)
            $escapedVersion = [regex]::Escape($version)
            $pattern = "(?ms)^##\s+\[?(?:$escapedTag|v?$escapedVersion)\]?[^\r\n]*\r?\n(.*?)(?=^##\s|\z)"
            $match = [regex]::Match($content, $pattern)
            if ($match.Success -and $match.Groups[1].Value.Trim()) {
              $notes = Join-Path $env:RUNNER_TEMP "release-notes.md"
              Set-Content -LiteralPath $notes -Value $match.Groups[1].Value.Trim() -Encoding UTF8
            }
          }
          $zip = "dist/ArnoldDW-$version-win64.zip"
          $setup = "dist/ArnoldDW-$version-setup.exe"
          if ($notes) {
            gh release create $tag $zip $setup --title "Arnold DW $version" --notes-file $notes
          } else {
            gh release create $tag $zip $setup --title "Arnold DW $version" --generate-notes
          }
