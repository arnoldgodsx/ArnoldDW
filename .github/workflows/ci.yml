name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest

  package-smoke:
    # Every push builds the app and the setup wizard, then installs,
    # starts and uninstalls the result on a clean runner.
    if: github.event_name == 'push'
    needs: lint-and-test
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Resolve runtime binary cache key
        id: runtime
        shell: pwsh
        run: |
          $content = Get-Content -Raw tools/fetch_binaries.py
          $hashes = [regex]::Matches($content, '"archive_sha256":\s*"([a-f0-9]{64})"') | ForEach-Object { $_.Groups[1].Value }
          if ($hashes.Count -lt 2) { throw "Could not read pinned runtime archive SHA-256 values" }
          "hash=$($hashes -join '-')" >> $env:GITHUB_OUTPUT

      - name: Cache verified runtime binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: runtime-${{ steps.runtime.outputs.hash }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y

      - name: Build app and setup wizard
        shell: pwsh
        run: .\tools\build.ps1 -Python (Get-Command python).Source -RequireInstaller

      - name: Check portable executable version and startup
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist/Arnold DW/Arnold DW.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "PyInstaller executable was not created" }
          $version = Start-Process -FilePath $exe -ArgumentList "--version" -Wait -PassThru
          if ($version.ExitCode -ne 0) { throw "--version exited with code $($version.ExitCode)" }
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $app.Refresh()
          if ($app.HasExited) { throw "Application exited before the 8-second startup check" }
          Stop-Process -Id $app.Id -Force

      - name: Install, launch and uninstall with the setup wizard
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter "ArnoldDW-*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "Setup wizard was not built" }
          .\tools\installer_smoke.ps1 -Setup $setup.FullName

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ArnoldDW-${{ github.sha }}-setup
          path: dist/ArnoldDW-*-setup.exe
          retention-days: 7
